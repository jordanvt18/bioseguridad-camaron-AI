name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs obsoletos al empujar nuevos commits a la misma rama/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias (torch CPU para acelerar)
        run: |
          pip install --upgrade pip
          # torch/torchvision desde el index CPU (mucho más rápido que el wheel CUDA)
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Ejecutar suite de tests (138)
        run: python -m pytest tests/ -q --tb=short --durations=10
