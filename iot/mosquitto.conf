# Configuración de Mosquitto para el broker MQTT local (docker-compose)
# Puertos: 1883 (MQTT) y 9001 (MQTT sobre WebSocket)
#
# ⚠️ SOLO PARA DESARROLLO LOCAL/LAN: allow_anonymous true permite que
# cualquier dispositivo de la red publique lecturas. Para producción:
#   - allow_anonymous false
#   - password_file /mosquitto/config/mosquitto.passwd
#   - credenciales en MQTT_USERNAME / MQTT_PASSWORD (ya soportadas por el puente)

persistence true
persistence_location /mosquitto/data/
log_dest stdout

allow_anonymous true
listener 1883
listener 9001
protocol websockets
