services:
  api:
    build: .
    container_name: bioseguridad-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=./models
      - DATA_PATH=./data
      - LOG_LEVEL=INFO
      # Puente MQTT activo por defecto (broker del compose)
      - MQTT_ENABLED=1
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
    volumes:
      - api-data:/app/data
      - api-models:/app/models
    depends_on:
      - mqtt
    networks:
      - bioseguridad-net
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: bioseguridad-web
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - bioseguridad-net
    restart: unless-stopped

  # Broker MQTT para sensores IoT reales (Mosquitto)
  mqtt:
    image: eclipse-mosquitto:2
    container_name: bioseguridad-mqtt
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT sobre WebSocket
    volumes:
      - ./iot/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    networks:
      - bioseguridad-net
    restart: unless-stopped

volumes:
  api-data:
  api-models:
  mqtt-data:

networks:
  bioseguridad-net:
    driver: bridge
